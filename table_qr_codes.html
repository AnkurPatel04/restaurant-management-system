<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestroX - Tables 1 to 5 QR Codes</title>
  <style>
    :root {
      --primary: #ff7a18;
      --primary-dark: #e8590c;
      --bg: #f8f9fa;
      --text: #212529;
      --card-bg: #ffffff;
      --border: #dee2e6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 30px 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--primary);
      margin-bottom: 8px;
    }

    header p {
      color: #6c757d;
      font-size: 1.05rem;
    }

    .control-panel {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 35px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 20px;
      align-items: end;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #495057;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(255, 122, 24, 0.15);
    }

    .btn-print {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.15s, opacity 0.2s;
      height: 46px;
    }

    .btn-print:hover {
      opacity: 0.95;
      transform: translateY(-2px);
    }

    /* Grid of Table QR Cards */
    .qr-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      justify-content: center;
    }

    /* Table Standee / Tent Card */
    .table-standee {
      background: #ffffff;
      border-radius: 20px;
      border: 2px solid #ffe8cc;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      padding: 30px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .table-standee:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 35px rgba(255, 122, 24, 0.15);
      border-color: var(--primary);
    }

    .standee-header {
      margin-bottom: 12px;
    }

    .restaurant-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: center;
    }

    .table-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      font-weight: 800;
      font-size: 1.15rem;
      padding: 6px 20px;
      border-radius: 50px;
      margin: 12px 0 15px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 12px rgba(255, 122, 24, 0.3);
    }

    .scan-tagline {
      font-size: 0.95rem;
      font-weight: 600;
      color: #343a40;
      margin-bottom: 14px;
    }

    .qr-wrapper {
      background: #fff;
      padding: 12px;
      border-radius: 16px;
      border: 1px solid #f1f3f5;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
      margin-bottom: 16px;
    }

    .qr-wrapper img {
      width: 200px;
      height: 200px;
      display: block;
      border-radius: 8px;
    }

    .steps-list {
      font-size: 0.82rem;
      color: #6c757d;
      line-height: 1.6;
      margin-bottom: 16px;
      text-align: center;
    }

    .table-link {
      font-size: 0.75rem;
      color: #868e96;
      text-decoration: none;
      word-break: break-all;
      padding: 4px 8px;
      background: #f8f9fa;
      border-radius: 6px;
      max-width: 100%;
      display: inline-block;
      transition: color 0.2s;
    }

    .table-link:hover {
      color: var(--primary);
    }

    /* Print Styles */
    @media print {
      body {
        background: #fff;
        padding: 0;
      }

      .control-panel, header p {
        display: none !important;
      }

      header h1 {
        font-size: 1.5rem;
        margin-bottom: 20px;
      }

      .qr-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }

      .table-standee {
        box-shadow: none !important;
        border: 2px solid #ff7a18 !important;
        page-break-inside: avoid;
        padding: 24px 16px;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .table-badge {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🍽️ RestroX Dine-In QR Standees</h1>
      <p>Instant table ordering QR codes for Tables 1 to 5. Ready for print and acrylic stands!</p>
    </header>

    <div class="control-panel">
      <div class="form-group">
        <label for="frontendUrl">Frontend Web App Base URL</label>
        <input type="text" id="frontendUrl" value="https://restaurant-ordering-system-phi.vercel.app" placeholder="e.g. https://your-app.vercel.app or http://localhost:5173" oninput="updateQRCodes()" />
      </div>

      <div class="form-group">
        <label for="restaurantId">Restaurant ID (MongoDB _id)</label>
        <input type="text" id="restaurantId" value="restaurant123" placeholder="Enter your restaurantId here" oninput="updateQRCodes()" />
      </div>

      <button class="btn-print" onclick="window.print()">
        🖨️ Print Standees
      </button>
    </div>

    <div class="qr-grid" id="qrGrid">
      <!-- Generated dynamically for Tables 1 through 5 -->
    </div>
  </div>

  <script>
    const tables = [1, 2, 3, 4, 5];

    function updateQRCodes() {
      const baseUrl = document.getElementById('frontendUrl').value.trim().replace(/\/+$/, '');
      const restaurantId = document.getElementById('restaurantId').value.trim() || 'restaurant123';
      const container = document.getElementById('qrGrid');

      container.innerHTML = tables.map(tableNumber => {
        const fullTargetUrl = `${baseUrl}/r/${restaurantId}/t/${tableNumber}`;
        const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(fullTargetUrl)}`;

        return `
          <div class="table-standee">
            <div class="standee-header">
              <div class="restaurant-title">🍽️ RestroX</div>
              <div class="table-badge">TABLE ${tableNumber < 10 ? '0' + tableNumber : tableNumber}</div>
            </div>

            <div class="scan-tagline">Scan Camera to Order & Pay</div>

            <div class="qr-wrapper">
              <img src="${qrApiUrl}" alt="Table ${tableNumber} QR Code" />
            </div>

            <div class="steps-list">
              1. Open camera & scan code<br/>
              2. Browse digital menu & customize<br/>
              3. Food delivered right to your table!
            </div>

            <a href="${fullTargetUrl}" target="_blank" class="table-link" title="Click to test landing URL">
              ${fullTargetUrl}
            </a>
          </div>
        `;
      }).join('');
    }

    // Auto initialize on load
    window.addEventListener('DOMContentLoaded', updateQRCodes);
  </script>
</body>
</html>

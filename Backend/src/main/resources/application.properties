spring.application.name=Full_Stack_Food_Delivery_App

# MongoDB Cloud / Local Connection
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/food_delivery_db}}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Stripe Configuration (Set in Render Dashboard environment variables)
stripe.secret.key=${STRIPE_SECRET_KEY:}

# Cloudinary Configuration (Set in Render Dashboard environment variables)
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}

# Frontend Client URL
app.frontend.url=${FRONTEND_URL:https://restaurant-ordering-system-phi.vercel.app}

# Render Server Port & Binding
server.address=0.0.0.0
server.port=${PORT:8080}




